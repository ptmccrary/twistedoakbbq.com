; CLI-only PHP settings. PHP reads php-cli.ini instead of php.ini for the CLI
; SAPI, so php-fpm is unaffected.
;
; Send errors and notices to stderr, not stdout, so command output stays clean and
; `2>/dev/null` can hide them. Under PHP 8.5 the WP-CLI phar prints a deprecation notice
; (plus an Xdebug call stack) on every command, which would otherwise corrupt
; machine-readable output such as `wp twisted-oak-menu dump`.
display_errors = stderr
